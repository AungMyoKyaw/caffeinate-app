<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caffeinate Carbon + Volt visual fixture</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="app-shell" id="fixture-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="product-name">Caffeinate</span>
        </div>
        <div class="local-note">
          <svg aria-hidden="true" viewBox="0 0 20 20">
            <path d="M6.5 8.5V6.8A3.5 3.5 0 0 1 10 3.3a3.5 3.5 0 0 1 3.5 3.5v1.7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path>
            <rect x="4.5" y="8.5" width="11" height="8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
          </svg>
          <span>Local only</span>
        </div>
      </header>

      <main class="control-surface">
        <section class="state-stage" aria-live="polite" aria-atomic="true">
          <div class="status-line">
            <span class="status-symbol" aria-hidden="true" id="fixture-symbol"><span class="ready-dot"></span></span>
            <span id="fixture-status">Ready</span>
          </div>
          <h1 id="fixture-heading">Mac can sleep.</h1>
          <p class="state-detail" id="fixture-detail">Start a wake session before a long task.</p>

          <div class="power-wrap">
            <button class="power-control" type="button" aria-label="Keep Mac Awake">
              <span class="power-ring" aria-hidden="true"></span>
              <svg class="power-glyph" aria-hidden="true" viewBox="0 0 40 40" fill="none">
                <path d="M20 5v14" stroke="currentColor" stroke-linecap="round" stroke-width="2.7"></path>
                <path d="M12.2 9.5a13 13 0 1 0 15.6 0" stroke="currentColor" stroke-linecap="round" stroke-width="2.7"></path>
              </svg>
            </button>
            <div class="action-caption">
              <strong id="fixture-action">Keep Mac Awake</strong>
              <span>⌘ Return</span>
            </div>
          </div>
        </section>

        <div class="error-banner" id="fixture-error" role="alert" hidden>
          <svg aria-hidden="true" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
            <path d="M10 5.8v5.1M10 14.1h.01" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path>
          </svg>
          <span>Unable to read the current wake session.</span>
        </div>

        <section class="settings" aria-label="Wake session settings">
          <fieldset class="setting-row duration-setting">
            <legend class="visually-hidden">Duration</legend>
            <div class="setting-copy">
              <span class="setting-title" aria-hidden="true">Duration</span>
              <span>Choose when this wake session should end.</span>
            </div>
            <div class="duration-rail" aria-label="Duration">
              <label class="chosen"><input type="radio" checked /><span>Until stopped</span></label>
              <label><input type="radio" /><span>30m</span></label>
              <label><input type="radio" /><span>1h</span></label>
              <label><input type="radio" /><span>2h</span></label>
              <label><input type="radio" /><span>4h</span></label>
            </div>
          </fieldset>

          <div class="setting-row">
            <div class="setting-copy">
              <label for="fixture-display">Keep display on</label>
              <span>Also prevent the screen from turning off.</span>
            </div>
            <label class="switch" for="fixture-display">
              <input id="fixture-display" type="checkbox" />
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            </label>
          </div>
        </section>
      </main>

      <footer class="technical-footer">
        <span class="command-label">Command</span>
        <code id="fixture-command">/usr/bin/caffeinate -i -w &lt;app-pid&gt;</code>
      </footer>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const active = params.get("active") === "1";
      const error = params.get("error") === "1";
      const busy = params.get("busy") === "1";
      if (active) {
        const shell = document.getElementById("fixture-shell");
        shell.classList.add("active");
        document.getElementById("fixture-symbol").innerHTML = '<svg viewBox="0 0 20 20"><path d="M11.2 1.8 5.7 10h3.8l-.7 8.2 5.5-9h-3.8l.7-7.4Z" fill="currentColor"></path></svg>';
        document.getElementById("fixture-status").textContent = "Awake";
        document.getElementById("fixture-heading").textContent = "Mac stays awake.";
        document.getElementById("fixture-detail").textContent = "System sleep is blocked. The display may still turn off. Until stopped.";
        document.getElementById("fixture-action").textContent = "Allow Sleep";
        document.getElementById("fixture-command").textContent = "/usr/bin/caffeinate -i -w 4242";
        document.querySelector(".duration-setting").disabled = true;
        document.getElementById("fixture-display").disabled = true;
        document.querySelector(".switch").classList.add("disabled");
      }
      if (error) {
        document.getElementById("fixture-shell").classList.add("error");
        document.getElementById("fixture-error").hidden = false;
      }
      if (busy) {
        document.getElementById("fixture-shell").classList.add("busy");
        document.getElementById("fixture-status").textContent = "Starting";
        document.getElementById("fixture-heading").textContent = "Mac can sleep.";
        document.getElementById("fixture-action").textContent = "Starting";
        document.querySelector(".power-control").disabled = true;
        document.querySelector(".power-glyph").outerHTML = '<span class="progress-mark" aria-hidden="true"></span>';
        document.querySelector(".duration-setting").disabled = true;
        document.getElementById("fixture-display").disabled = true;
        document.querySelector(".switch").classList.add("disabled");
      }
    </script>
  </body>
</html>
